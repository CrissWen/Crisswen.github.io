<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>БУНКЕР</title>
  <link rel="icon" type="image/svg+xml" href="icons/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Share+Tech+Mono&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Підключаємо стилі -->
  <link rel="stylesheet" href="css/styles.css">
  <!-- Сюди JS (theme-manager.js) буде підставляти потрібний файл теми -->
  <link id="theme-stylesheet" rel="stylesheet" href="css/themes/theme-classic.css">
  <script>
    // Застосовує збережену тему СИНХРОННО, до першого рендеру — інакше при кожному перезавантаженні на частку
    // секунди блимала б дефолтна тема "Класика", поки не встиг би завантажитися js/app.js (там живе
    // єдине джерело правди — js/utils/theme-manager.js; тут дублюється лише ключ і шаблон шляху до файлу теми).
    (function () {
      try {
        var t = localStorage.getItem('bunker-theme');
        if (t === 'stalker' || t === 'fallout' || t === 'cyberpunk' || t === 'cryo' || t === 'patriot') {
          document.getElementById('theme-stylesheet').href = 'css/themes/theme-' + t + '.css';
        }
      } catch (e) { /* localStorage недоступний (приватний режим тощо) — лишаємося на дефолтній href вище */ }
    })();
  </script>
  <link rel="stylesheet" href="css/header.css"> <!-- Додали новий файл -->
</head>
<body>
  
<!-- НОВИЙ ГЛОБАЛЬНИЙ ХЕДЕР -->
  <header class="main-header" id="global-header" style="display: none;">
    <div class="header-left">
      <a href="#/lobby" class="header-logo">
        <img src="icons/favicon.png" alt="Лого" class="header-logo-icon">
        БУНКЕР
      </a>
      <nav class="header-nav">
        <a href="#/packs" class="header-nav-link" data-nav-path="#/packs">Паки</a>
        <!-- «Гра»: прихована, поки немає активної сесії; href і видимість виставляє js/utils/last-session.js -->
        <a class="header-nav-link" id="header-game-link" data-nav-path="#/game" hidden>Гра</a>
      </nav>
    </div>

    <div class="header-right">
      <a href="#/profile" class="header-profile-link">
        <!-- Додали id="header-user-avatar" і прибрали смайлик -->
        <span class="header-user-avatar" id="header-user-avatar">?</span>
        <span class="header-user-name" id="header-user-name">Завантаження...</span>
      </a>

      <!-- Швидке керування звуком у хедері (праворуч від профілю) -->
      <div class="header-audio-widget" id="header-audio-widget">
        <button
          type="button"
          class="bunker-mute-btn header-audio-btn"
          id="header-audio-btn"
          aria-label="Увімкнути або вимкнути звук"
          title="Клік — вимкнути/увімкнути звук"
        >
          <img class="bunker-mute-btn__icon bunker-mute-btn__icon--on" src="icons/audio/volume-on.svg" alt="" aria-hidden="true">
          <img class="bunker-mute-btn__icon bunker-mute-btn__icon--off" src="icons/audio/volume-off.svg" alt="" aria-hidden="true">
        </button>

        <div class="header-audio-popover" id="header-audio-popover" role="region" aria-label="Швидкі налаштування гучності">
          <div class="header-audio-popover__head">
            <span class="header-audio-popover__title">Загальна гучність</span>
            <span class="header-audio-popover__val" id="header-audio-master-val">80%</span>
          </div>
          <input
            type="range"
            class="bunker-slider header-audio-slider"
            id="header-audio-master-slider"
            min="0"
            max="100"
            step="1"
            value="80"
            aria-label="Загальна гучність"
          >
          <div class="header-audio-popover__foot">
            <button type="button" class="header-audio-link" id="header-audio-open-settings">
              Налаштування звуку →
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="wrap">
    <!-- Тимчасову навігацію та старий header видалено -->
    
    <main id="app"><!-- place where router insert pages --></main>
  </div>
  
  <!-- Бейдж глядача -->
  <div id="spectator-badge" class="spectator-badge is-hidden" role="status">
    <img alt="" class="spectator-badge__icon">
    <span class="spectator-badge__text">Ви слідкуєте за грою</span>
  </div>

  <!-- Оверлей кидка кубика -->
  <div id="dice-overlay" class="dice-overlay is-hidden" role="status" aria-live="polite">
    <div class="confetti-container" data-confetti aria-hidden="true"></div>
    <div class="dice-stage">
      <div class="dice" data-dice><span data-dice-value></span></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/vendor/howler.min.js"></script>
  <!-- Router -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
