<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>БУНКЕР</title>
  <link rel="icon" type="image/svg+xml" href="icons/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Share+Tech+Mono&family=VT323&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Підключаємо стилі -->
  <link rel="stylesheet" href="css/styles.css">
  <!-- Сюди JS (theme-manager.js) буде підставляти потрібний файл теми -->
  <link id="theme-stylesheet" rel="stylesheet" href="css/themes/theme-classic.css">
  <script>
    // Застосовує збережену тему СИНХРОННО, до першого рендеру — інакше при кожному перезавантаженні на частку
    // секунди блимала б дефолтна тема "Класика", поки не встиг би завантажитися js/app.js (там живе
    // єдине джерело правди — js/utils/theme-manager.js; тут дублюється лише ключ і шаблон шляху до файлу теми).
    (function () {
      try {
        var t = localStorage.getItem('bunker-theme');
        if (t === 'stalker' || t === 'fallout' || t === 'cyberpunk' || t === 'cryo' || t === 'patriot') {
          document.getElementById('theme-stylesheet').href = 'css/themes/theme-' + t + '.css';
        }
      } catch (e) { /* localStorage недоступний (приватний режим тощо) — лишаємося на дефолтній href вище */ }
    })();
  </script>
  <link rel="stylesheet" href="css/header.css"> <!-- Додали новий файл -->
</head>
<body>
  
<!-- НОВИЙ ГЛОБАЛЬНИЙ ХЕДЕР -->
  <header class="main-header" id="global-header" style="display: none;">
    <div class="header-left">
      <a href="#/lobby" class="header-logo">
        <img src="icons/favicon.png" alt="Лого" class="header-logo-icon">
        БУНКЕР
      </a>
      <nav class="header-nav">
        <a href="#/packs" class="header-nav-link" data-nav-path="#/packs">Паки</a>
      </nav>
    </div>
    
    <a href="#/profile" class="header-profile-link">
      <!-- Додали id="header-user-avatar" і прибрали смайлик -->
      <span class="header-user-avatar" id="header-user-avatar">?</span>
      <span class="header-user-name" id="header-user-name">Завантаження...</span>
    </a>
  </header>

  <div class="wrap">
    <!-- Тимчасову навігацію та старий header видалено -->
    
    <main id="app"><!-- place where router insert pages --></main>
  </div>
  
  <!-- Бейдж глядача -->
  <div id="spectator-badge" class="spectator-badge is-hidden" role="status">
    <img src="./icons/eye.svg" alt="" class="spectator-badge__icon">
    <span class="spectator-badge__text">Ви слідкуєте за грою</span>
  </div>

  <!-- Оверлей кидка кубика -->
  <div id="dice-overlay" class="dice-overlay is-hidden" role="status" aria-live="polite">
    <div class="confetti-container" data-confetti aria-hidden="true"></div>
    <div class="dice-stage">
      <div class="dice" data-dice><span data-dice-value></span></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Router -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
