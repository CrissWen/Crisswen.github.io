<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>БУНКЕР — інтерфейс гри</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Підключаємо стилі -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/header.css"> <!-- Додали новий файл -->
</head>
<body>
  
<!-- НОВИЙ ГЛОБАЛЬНИЙ ХЕДЕР -->
  <header class="main-header" id="global-header" style="display: none;">
    <a href="#/lobby" class="header-logo">БУНКЕР</a>
    
    <a href="#/profile" class="header-profile-link">
      <!-- Додали id="header-user-avatar" і прибрали смайлик -->
      <span class="header-user-avatar" id="header-user-avatar">?</span>
      <span class="header-user-name" id="header-user-name">Завантаження...</span>
    </a>
  </header>

  <div class="wrap">
    <!-- Тимчасову навігацію та старий header видалено -->
    
    <main id="app"><!-- place where router insert pages --></main>

    <footer class="note">БУНКЕР · демо-версія v0.1</footer>
  </div>
  
  <!-- Бейдж глядача -->
  <div id="spectator-badge" class="spectator-badge is-hidden" role="status">
    <img src="./icons/eye.svg" alt="" class="spectator-badge__icon">
    <span class="spectator-badge__text">Ви слідкуєте за грою</span>
  </div>

  <!-- Оверлей кидка кубика -->
  <div id="dice-overlay" class="dice-overlay is-hidden" role="status" aria-live="polite">
    <div class="confetti-container" data-confetti aria-hidden="true"></div>
    <div class="dice-stage">
      <div class="dice" data-dice><span data-dice-value></span></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Router -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
